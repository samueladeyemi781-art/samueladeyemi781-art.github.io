<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSUK Attendance Portal</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f7f6; }
       .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input { width: 90%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 6px; }
        button { background: #007bff; color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        #status { margin-top: 20px; font-weight: bold; padding: 10px; border-radius: 4px; }
       .error { color: #721c24; background: #f8d7da; }
       .success { color: #155724; background: #d4edda; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #0056b3;">Attendance Check-in</h2>
        <p>NS-CSC 219 - Computer Science</p>
        <input type="text" id="studentId" placeholder="Enter Matric Number" required>
        <button onclick="getLocation()">Verify & Sign In</button>
        <div id="status">Waiting for input...</div>
    </div>

    <script>
        const targetLat = 8.841237; 
        const targetLon = 7.908366; 
        const radius = 0.0005; 
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwu7FGxBivmHNAbvOTb1NtwSi444QDuxYJd8BKWmFJD9C3CEszR4FigK_dRBzfSZiORZQ/exec';

        function getLocation() {
            const statusBox = document.getElementById("status");
            const studentId = document.getElementById("studentId").value.trim();

            if (!studentId) {
                statusBox.className = "error";
                statusBox.innerHTML = "Please enter your Matric Number.";
                return;
            }

            statusBox.className = "";
            statusBox.innerHTML = "📡 Accessing GPS...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const isInside = Math.abs(lat - targetLat) < radius && Math.abs(lon - targetLon) < radius;

                        if (isInside) {
                            statusBox.innerHTML = "✅ Location Valid. Saving...";
                            sendData(studentId, lat, lon);
                        } else {
                            statusBox.className = "error";
                            statusBox.innerHTML = "❌ Denied: You are not in the classroom.";
                        }
                    },
                    (err) => { statusBox.className = "error"; statusBox.innerHTML = "GPS Error: " + err.message; },
                    { enableHighAccuracy: true }
                );
            }
        }

        function sendData(id, lt, ln) {
            const statusBox = document.getElementById("status");
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', // Bypasses CORS issues for Google Scripts
                body: JSON.stringify({ studentId: id, lat: lt, lon: ln })
            }).then(() => {
                statusBox.className = "success";
                statusBox.innerHTML = "🎉 Success! Attendance Recorded.";
            }).catch(() => {
                statusBox.className = "error";
                statusBox.innerHTML = "Network Error. Check your data.";
            });
        }
    </script>
</body>
</html>
